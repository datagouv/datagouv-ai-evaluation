# ─────────────────────────────────────────────
# TASK 09
# ─────────────────────────────────────────────

task_id: task_0009
task_name: API pour organismes certificateurs - récupérer les RNCP passés et en cours

meta:
  status: active
  source: forum

prompt: >
  Existe-t-il une API qui permettrait à un organisme certificateur de récupérer
  tous ses RNCP passés et en cours ?


evaluation_criteria:
  minimal:
    - criteria: >
        Agent surfaces "API Certif Info" as the primary relevant API.
    - criteria: >
        Agent mentions that it requires a connexion token to connect to the API.

    # For now we don't return the spec about restriction so it can't know that
    #- criteria: >
    #    Agent notes that "API Certif Info" is restricted to public organisations
    #    and is not available to private certification bodies.

    - criteria: >
        Agent mentions the dataset "Répertoire national des certifications professionnelles et répertoire spécifique"
        (RNCP) as an alternative source.

  optimal:

    - criteria: >
        Agent notes that "Répertoire national des certifications professionnelles et répertoire spécifique"
        is not accessible via the tabular API (no MCP query possible) and direct download through the stable URL is the practical workaround.

    - criteria: >
        Agent provides the "Répertoire national des certifications professionnelles et répertoire spécifique"
        download URL or clear path to the CSV .zip and the documentation.


action_chain:
  minimal:
    chain: (search.dataservices > get.dataservice.info > get.dataservice.openapi_spec) + (search.datasets > get.dataset.info)
    required_actions:
      - name: search.dataservices
        args:
          - name: query
            criteria: >
              Semantically relevant to RNCP certification API or professional
              qualification registry. e.g. "RNCP", "Certif Info", "certification professionnelle"
      - name: get.dataservice.info
        args:
          - name: dataservice_id
            strict_value: "68629060ac286e24c94ba08c"  # API Certif Info
      - name: get.dataservice.openapi_spec
        args:
          - name: dataservice_id
            strict_value: "68629060ac286e24c94ba08c"  # (accès restreint)
      - name: search.datasets
        args:
          - name: query
            criteria: >
              Semantically relevant to RNCP national registry dataset.
              e.g. "RNCP", "répertoire national certifications professionnelles"
      - name: get.dataset.info
        args:
          - name: dataset_id
            strict_value: "5eebbc067a14b6fecc9c9976"  # RNCP dataset

  optimal:
    chain: >
      (search.dataservices > get.dataservice.info > get.dataservice.openapi_spec)
      + (search.datasets > get.dataset.info > get.dataset.resources > get.resource.info)
    required_actions:
      - name: get.dataset.resources
        args:
          - name: dataset_id
            strict_value: "5eebbc067a14b6fecc9c9976"
      - name: get.resource.info
        args:
          - name: resource_id
            strict_value: "42824627-145d-4f68-bd56-0b0aa04df392"  #! Might change over time, to check

resources:
  - type: dataservice
    id: "68629060ac286e24c94ba08c"  # API Certif Info (accès restreint aux organismes publics)
    checks:
      - fn: same_title_description
        params: {id: ~}
  - type: dataset
    id: "5eebbc067a14b6fecc9c9976"  # Répertoire national des certifications professionnelles et répertoire spécifique
    checks:
      - fn: same_title_description
        params: {id: ~}
  - type: resource
    dataset_id: "5eebbc067a14b6fecc9c9976"
    id: "42824627-145d-4f68-bd56-0b0aa04df392"  # zip
    checks:
      - fn: download_url_reachable
        params: {}
