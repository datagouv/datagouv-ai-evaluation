task_id: # unique ID
task_name: # Human-friendly name

meta:
  status: active | deprecated | draft
  source: forum | support | interview | synthetic

prompt: # User prompt

evaluation_criteria:
  # Criteria are truth about the response (not the tool usage). MCP-agnostic.
  minimal:
    # Minimum for the response to be true and helpful.
    # e.g. prompt "where can I find X?" -> answer "X can be found this way [...]"
    - criteria: # str
  optimal:
    # What a good agent would do to fully answer.
    # e.g. "X can be found this way [...] or alternatively [...]. Here is X: [...]"
    - criteria: # str

action_chain:
  # Framework-agnostic semantic actions. Resolved to concrete tool/endpoint names
  # at evaluation time via the semantic layer (semantic_layer.yml).
  # Use semantic action names: search.datasets, get.dataset.info, get.dataset.resources,
  # get.resource.info, get.resource.profile, get.data, get.data,
  # search.dataservices, get.dataservice.info, get.dataservice.openapi_spec
  minimal:
    chain: # e.g. search.datasets > get.dataset.info > get.data
           # or (search.datasets > get.dataset.info) + (search.dataservices > get.dataservice.info)
    required_actions:
      - name: # semantic action name (e.g. search.datasets)
        args:
          - name: # semantic arg name (e.g. query, dataset_id, resource_id, dataservice_id)
            strict_value: ~ # exact deterministic value — fill if criteria is empty
            criteria: ~     # semantic description — fill if strict_value is empty
  optimal:
    chain: # Complete chain — order may differ from minimal
    required_actions:
      # Only additional actions not already listed in minimal
      - name: # semantic action name
        args:
          - name: # semantic arg name
            strict_value: ~
            criteria: ~

resources:
  # Run before evaluation to catch silent failures (archived dataset, changed title, etc.)
  - type: dataset | resource | dataservice | organization
    id: # dataset_id or resource_id depending on type
    checks:
      - fn: # Literal[same_title_description, download_url_reachable, tabular_api_available, update_date_more_recent_than]
            # Function to run the check, shouldn't be dependant on each task but rather shared reusable check function
        params: {} # e.g. {field: update_frequency, expected_value: snapshot_key} - snapshot key will be created later
