# ─────────────────────────────────────────────
# TASK 01
# ─────────────────────────────────────────────

task_id: task_0001
task_name: Recherche services neurologie SEP en France

meta:
  status: active
  source: forum

prompt: >
  Où puis-je trouver le nombre de services de neurologie (CH/CHU/CHR)
  en France ? Idéalement, uniquement ceux traitant la sclérose en plaques (SEP).


evaluation_criteria:
  minimal:
    - criteria: >
        Agent explicitly states that no dedicated open dataset exists
        for neurology services or SEP specifically on data.gouv.fr.

    - criteria: >
        Agent surfaces the API FHIR Annuaire Santé as a relevant
        source to query health facility data by specialty.

    - criteria: >
        Agent mentions the "FINESS Extraction du Fichier des établissements" dataset as an alternative source
        for health facility registry data.

    - criteria: >
        Agent does not present an unrelated health dataset
        as if it directly answers the question.


  optimal:
    - criteria: >
        Agent explains the practical difference between FINESS
        (static file, annual update, facility-level data) and the
        API FHIR Annuaire Santé (live API, FHIR standard, richer
        structured data) for the user's use case.

    - criteria: >
        Agent mentions the "FINESS Extraction du Fichier des établissements" dataset will
        be deprecated starting summer 2026 and that a new dataset will be available.

    - criteria: >
        Agent mentions the "FINESS Extraction du Fichier des établissements" dataset
        has no resource accessible via Tabular API and cannot be queried via the MCP.

    - criteria: >
        Agent notes that SEP-specific filtering seems not available
        on these results only and would require access to PMSI or clinical registries.

    - criteria: >
        Agent mentions the "FINESS Extraction du Fichier des établissements" dataset
        does not contain details about SEP or neurology services,
        but only general information about the facilities.
    - criteria: >
        Agent explains what FHIR query parameters the user would need
        to filter by neurology specialty (e.g. specialty code) and
        points to the relevant endpoint in the API.

action_chain:
  minimal:
    chain: (search.datasets > get.dataset.info) + (search.dataservices > get.dataservice.info)
    required_actions:
      - name: search.dataservices
        args:
          - name: query
            criteria: Semantically relevant to SEP / neurology
      - name: search.dataservices
        args:
          - name: query
            criteria: >
              Semantically relevant to broader health facility API or professional
              directory: "FHIR", "FINESS", "annuaire santé", "établissements sanitaires"
      - name: get.dataservice.info
        args:
            - name: dataservice_id
              strict_value: "69402c6dd7dd82fdccc46429"  # API FHIR Annuaire Santé
      - name: search.datasets
        args:
          - name: query
            criteria: Semantically relevant to SEP / neurology
      - name: search.datasets
        args:
          - name: query
            criteria: >
              Semantically relevant to broader health facility or professional
              directory: "FHIR", "FINESS", "annuaire santé", "établissements sanitaires"
      - name: get.dataset.info
        args:
          - name: dataset_id
            strict_value: "536c47d9a3a72933d8d1b3b2"

  optimal:
    chain: >
      (search.datasets > get.dataset.info > get.dataset.resources > get.resource.info)
      + (search.dataservices > get.dataservice.info > get.dataservice.openapi_spec)
    required_actions:
      - name: get.dataset.resources
        args:
          - name: dataset_id
            strict_value: "536c47d9a3a72933d8d1b3b2"  # FINESS
      - name: get.resource.info
        args:
          - name: resource_id
            strict_value: "98f3161f-79ff-4f16-8f6a-6d571a80fea2"  # FINESS 1st resource
      - name: get.resource.info
        args:
          - name: resource_id
            strict_value: "2ce43ade-8d2c-4d1d-81da-ca06c82abc68"  # FINESS 2nd resource
      - name: get.dataservice.openapi_spec
        args:
          - name: dataservice_id
            strict_value: "69402c6dd7dd82fdccc46429"

resources:
  - type: dataservice
    id: "69402c6dd7dd82fdccc46429"  # API FHIR Annuaire Santé
    checks:
      - fn: same_title_description
        params: {id: ~}
  - type: dataset
    id: "536c47d9a3a72933d8d1b3b2"  # FINESS (archived)
    checks:
      - fn: same_title_description
        params: {id: ~}
