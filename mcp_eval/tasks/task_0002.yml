task_id: task_0002
task_name: Compter les datasets data.gouv.fr avant juin 2012

meta:
  status: active
  source: forum
  turn: single
  minimal_tool_invocation_type: multi_tool
  optimal_tool_invocation_type: multi_tool

prompt: >
  Combien y avait-il de jeux de données sur data.gouv.fr avant le 28 juin 2012,
  date du lancement officiel de la plateforme ? (Contexte : 363 pour Québec à la même date.)

draft_answer: >
  1/ chercher et trouver https://www.data.gouv.fr/datasets/catalogue-des-donnees-de-data-gouv-fr
  2/ profiling pour comprendre le jeu, 3/ utiliser l'API tabulaire ensuite pour récupérer les
  jeux "inférieur à" la date en question sur la bonne colonne, ensuite un simple count par
  l'agent (s'il peut) peut donner la réponse. La réponse serait soit voici la liste, soit
  voici le chiffre.

evaluation_criteria:
  - v_introduced: "1.0"
    minimal:
      - criteria: >
          Agent identifies that the answer requires querying
          the data.gouv.fr catalog dataset itself, not a domain dataset.
        
      - criteria: >
          Agent attempts a tabular query with a date filter
          on the catalog dataset (created_at < 2012-06-28).
        
      - criteria: >
          Agent returns the number : 2076.
        

    optimal:
      - criteria: >
          Agent identifies the correct date column to filter on
          and explains its choice (created_at : not date_created or published_at).
        
      - criteria: >
          Agent returns the exact count : 2076, with the query logic explained.
        
      - criteria: >
          Agent notes any data quality caveat, e.g. creation date
          in the catalog may not match the original publication date.
        

tool_chain:
  - v_introduced: "1.0"
    minimal:
      chain: search_datasets > get_dataset_info > list_dataset_resources > query_resource_data
      required_tools:
        - name: search_datasets
          args:
            - name: query
              criteria: >
                Semantically relevant to the data.gouv.fr catalog itself.
                e.g. "catalogue data.gouv.fr", "liste des jeux de données"
        - name: get_dataset_info
          args:
            - name: dataset_id
              strict: "5d13a8b6634f41070a43dff3"
        - name: list_dataset_resources
          args:
            - name: dataset_id
              strict: "5d13a8b6634f41070a43dff3"
        - name: get_resource_info
          args:
            - name: resource_id
              strict: "f868cca6-8da1-4369-a78d-47463f19a9a3"
        - name: query_resource_data
          args:
            - name: resource_id
              strict: "f868cca6-8da1-4369-a78d-47463f19a9a3"
            - name: filters
              criteria: >
                Date filter on creation column, before 2012-06-28.
                e.g. created_at < "2012-06-28"

    optimal:
      chain: search_datasets > get_dataset_info > list_dataset_resources > query_resource_data
      required_tools:
        - name: query_resource_data
          args:
            - name: filters
              criteria: >
                Filter on the correct date column (not modified_at or published_at)
                with correct ISO date format and count aggregation

resources:
  - type: dataset
    id: "5d13a8b6634f41070a43dff3"  # catalogue data.gouv.fr
    checks:
      - fn: same_title_description
        params: {id: ~}
      - fn: tabular_api_reachable
        params: {}
  - type: resource
    id: "f868cca6-8da1-4369-a78d-47463f19a9a3"
    checks:
      - fn: resource_is_tabular
        params: {}