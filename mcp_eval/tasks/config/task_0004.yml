task_id: task_0004
task_name: Personnes habilitées au diagnostic structurel des immeubles (L 126-6-1 CCH)

meta:
  status: active
  source: forum
  turn: single
  minimal_tool_invocation_type: multi_tool
  optimal_tool_invocation_type: multi_tool

prompt: >
  Notre collectivité envisage la mise en place de périmètres imposant la réalisation
  du diagnostic structurel des immeubles d'habitation (L 126-6-1 du CCH).
  Où trouver la liste des personnes habilitées ?

draft_answer: >
  Dataset 10d654ce-d0ea-4a57-a187-80b127b2b2b9, lire description + profiling + tentative
  filtre colonne. En réalité il faut connaître le numéro de certificat pour identifier
  une personne précise (non trouvé rapidement sans cela).

evaluation_criteria:
  - v_introduced: "1.0"
    minimal:
      - criteria: >
          Agent finds the dataset "Annuaire des diagnostiqueurs immobiliers".
        
      - criteria: >
          Agent reads the dataset description and conveys the nature of the data
          (list of certificate holders).
        
      - criteria: >
          Agent provides a direct download link or tabular query path
          so the collectivité can access the full list.
        

    optimal:
      - criteria: >
          Agent explains that filtering the list by commune or name is possible.
      - criteria: >
          Agent explains that it requires filtering by a known certificate number 
          as entry point first.
        

        

tool_chain:
  - v_introduced: "1.0"
    minimal:
      chain: search_datasets > get_dataset_info > list_dataset_resources > get_resource_info
      required_tools:
        - name: search_datasets
          args:
            - name: query
              criteria: >
                Semantically relevant to certified persons for structural building diagnostics.
                e.g. "diagnostic structurel", "habilitation", "L 126-6-1", "immeubles habitation"
        - name: get_dataset_info
          args:
            - name: dataset_id
              strict_value: "5bc5df57634f417a900a5ed0"
        - name: list_dataset_resources
          args:
            - name: dataset_id
              strict_value: "5bc5df57634f417a900a5ed0"
        - name: get_resource_info
          args:
            - name: resource_id
              strict_value: "7987214d-949e-4245-b005-5cc4e7a5df36"

    optimal:
      chain: search_datasets > get_dataset_info > list_dataset_resources > get_resource_info > query_resource_data
      required_tools:
        - name: query_resource_data
          args:
            - name: resource_id
              strict_value: "7987214d-949e-4245-b005-5cc4e7a5df36"



resources:
  - type: dataset
    id: "5bc5df57634f417a900a5ed0"  # Annuaire des diagnostiqueurs immobiliers
    checks:
      - fn: same_title_description
        params: {id: ~}
  - type: resource
    dataset_id: "5bc5df57634f417a900a5ed0"
    id: "7987214d-949e-4245-b005-5cc4e7a5df36"
    checks:
      - fn: same_title_description
        params: {id: ~}
      - fn: tabular_api_available
        params: {}
