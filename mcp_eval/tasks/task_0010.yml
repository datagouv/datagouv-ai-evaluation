task_id: task_0010
task_name: APIs pour outils pédagogiques - patrimoine culturel, démographie, éducation

meta:
  status: active
  source: synthetic
  turn: single
  minimal_tool_invocation_type: multi_tool
  optimal_tool_invocation_type: multi_tool

prompt: >
  Je développe des outils pédagogiques et cherche des APIs pour automatiser
  l'intégration de patrimoine culturel français, données démographiques des communes,
  statistiques éducatives. Endpoints avec authentification simple ?

draft_answer: >
  Chercher APIs + datasets tabular. Réponses : API Éducation Nationale (672cf9be, ouverte),
  Explore API v2 éducation (6690aa63, ouverte), API Démarches Ministère Culture (672cfc6b, ouverte),
  scanR (672cfc39, ouverte). Avec compte : API La bonne alternance (672cf64f),
  API Diffusion Données Locales INSEE (672cf9c3).
  Note : Basilic (lieux culturels) et Explore API v2 culture non trouvés dans le catalogue
  au moment de la rédaction.

evaluation_criteria:
  - v_introduced: "1.0"
    minimal:
      - criteria: >
          Agent returns at least three relevant APIs covering at least two of the three
          requested domains (education, cultural heritage, demographics).
        
      - criteria: >
          Agent includes a brief description and the access type (open / account required)
          for each API it returns.
        
      - criteria: >
          Agent distinguishes between APIs that require no registration and those
          that require an account or prior agreement.
        

    optimal:
      - criteria: >
          Agent categorises its results by domain (education, cultural heritage,
          demographics / local data) for clarity.
        
      - criteria: >
          Agent includes "API données ouvertes de l'Éducation Nationale" and
          "Explore API v2 https://data.education.gouv.fr" for the education domain.
        
      - criteria: >
          Agent includes "API Démarches du Ministère de la culture" or
          "scanR, moteur de la recherche et de l'innovation" for the cultural or research heritage domain.
        
      - criteria: >
          Agent includes "API Diffusion Données Locales" for demographics,
          and notes that it requires a registered account.
        
      - criteria: >
          Agent lists specific endpoint paths or key query parameters
          for at least one API it recommends.
        

tool_chain:
  - v_introduced: "1.0"
    minimal:
      chain: search_dataservices > get_dataservice_info
      required_tools:
        - name: search_dataservices
          args:
            - name: query
              criteria: >
                Semantically relevant to education open data API.
                e.g. "éducation nationale API", "statistiques éducatives"
        - name: search_dataservices
          args:
            - name: query
              criteria: >
                Semantically relevant to cultural heritage or cultural places.
                e.g. "patrimoine culturel", "culture ministère", "lieux culturels"
        - name: search_dataservices
          args:
            - name: query
              criteria: >
                Semantically relevant to local demographic data by commune.
                e.g. "données locales communes", "démographie INSEE"
        - name: get_dataservice_info
          args:
            - name: dataservice_id
              strict_value: "672cf9be6136ac3468829101"  # API données ouvertes Éducation Nationale
        - name: get_dataservice_info
          args:
            - name: dataservice_id
              strict_value: "672cfc6bfc959adaf03a4d00"  # API Démarches Ministère Culture
        - name: get_dataservice_info
          args:
            - name: dataservice_id
              strict_value: "672cf9c3c3488a0c533f709f"  # API Diffusion Données Locales (INSEE)

    optimal:
      chain: search_dataservices > get_dataservice_info > get_dataservice_openapi_spec
      required_tools:
        - name: get_dataservice_info
          args:
            - name: dataservice_id
              strict_value: "6690aa63b75843d0411ff6af"  # Explore API v2 éducation
        - name: get_dataservice_info
          args:
            - name: dataservice_id
              strict_value: "672cfc39db38d1541be152f8"  # scanR
        - name: get_dataservice_info
          args:
            - name: dataservice_id
              strict_value: "672cf64ff8b5d52b76263394"  # API La bonne alternance (compte requis)
        - name: get_dataservice_openapi_spec
          args:
            - name: dataservice_id
              criteria: Any one of the confirmed APIs above

resources:
  - type: dataservice
    id: "672cf9be6136ac3468829101"  # API données ouvertes de l'Éducation Nationale (ouverte)
    checks:
      - fn: same_title_description
        params: {id: ~}
  - type: dataservice
    id: "6690aa63b75843d0411ff6af"  # Explore API v2 éducation (ouverte)
    checks:
      - fn: same_title_description
        params: {id: ~}
  - type: dataservice
    id: "672cfc6bfc959adaf03a4d00"  # API Démarches du Ministère de la culture (ouverte)
    checks:
      - fn: same_title_description
        params: {id: ~}
  - type: dataservice
    id: "672cfc39db38d1541be152f8"  # scanR, moteur de la recherche et de l'innovation (ouverte)
    checks:
      - fn: same_title_description
        params: {id: ~}
  - type: dataservice
    id: "672cf64ff8b5d52b76263394"  # API La bonne alternance (compte requis)
    checks:
      - fn: same_title_description
        params: {id: ~}
  - type: dataservice
    id: "672cf9c3c3488a0c533f709f"  # API Diffusion Données Locales INSEE (compte requis)
    checks:
      - fn: same_title_description
        params: {id: ~}